<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acompanhamento Nutricional - Jessica Melo Nutri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/jpeg" href="/assets/images/Jessica-site2.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>tailwind.config={theme:{extend:{colors:{primary:'#f47a3c',orange:'#ff8b47',dark:'#17181d',panel:'#22242b',muted:'#a9abb3'}}}};</script>
  <style>
    body{font-family:Poppins,sans-serif;transition:background .2s,color .2s;letter-spacing:-.01em}header{height:76px;backdrop-filter:blur(18px)}.library-frame{border-radius:1.75rem;overflow:hidden;margin:1.25rem;box-shadow:0 22px 60px rgba(0,0,0,.2)}.library-hero{position:relative;overflow:hidden;border-radius:1.25rem;padding:.8rem 1.2rem;min-height:92px;background:linear-gradient(115deg,#e7793e,#a9483b 58%,#343044);box-shadow:0 14px 34px rgba(0,0,0,.18)}.library-hero:after{content:'';position:absolute;width:260px;height:260px;right:-70px;top:-110px;border:1px solid rgba(255,255,255,.25);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.05),0 0 0 56px rgba(255,255,255,.035)}.library-hero>*{position:relative;z-index:1}.resource-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}.resource-card{display:flex;flex-direction:column;min-height:220px;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:1.25rem;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.025));box-shadow:0 12px 28px rgba(0,0,0,.16);transition:transform .2s,box-shadow .2s,border-color .2s;cursor:pointer}.resource-card:hover{transform:translateY(-5px);border-color:rgba(244,122,60,.75);box-shadow:0 20px 38px rgba(0,0,0,.28)}.resource-cover{height:124px;background:#30323a;display:flex;align-items:center;justify-content:center}.resource-copy{padding:1rem}.resource-icon{width:54px;height:54px;border-radius:1rem;background:rgba(244,122,60,.18);color:#ff8b47;display:flex;align-items:center;justify-content:center}.scrollbar::-webkit-scrollbar{width:7px}.scrollbar::-webkit-scrollbar-thumb{background:#4b4d56;border-radius:999px}body[data-patient-theme=traditional]{background:#faf8f3;color:#3d3226}body[data-patient-theme=traditional] header{background:rgba(255,255,255,.94);border-color:rgba(61,50,38,.12)}body[data-patient-theme=traditional] main{background:#faf8f3;color:#3d3226}body[data-patient-theme=traditional] .resource-card{background:#f7e6d7;border-color:rgba(61,50,38,.13);box-shadow:0 12px 28px rgba(100,73,42,.1)}body[data-patient-theme=traditional] .resource-copy{background:#f7e6d7}body[data-patient-theme=traditional] .resource-card:hover{border-color:#d98045}body[data-patient-theme=traditional] .text-white{color:#3d3226}body[data-patient-theme=traditional] .text-muted{color:#5f554b!important}
  </style>
</head>
<body class="bg-dark text-white min-h-screen">
  <header class="bg-[#1d1e24] border-b border-white/5 flex items-center justify-between px-4 sm:px-7 sticky top-0 z-40">
    <div class="flex items-center gap-2 sm:gap-3"><a href="/paciente.html" class="block"><img data-patient-logo src="/assets/images/Logomarca_nobg_branco.png" class="w-32 sm:w-40 h-auto max-h-10 object-contain" alt="Jessica Melo Nutricionista"></a><a href="/paciente.html" class="inline-flex items-center gap-2 rounded-lg px-2 py-1.5 text-xs text-muted hover:bg-white/10 hover:text-white transition-all" aria-label="Conhecimento que Nutre"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M4 5.5v16M8 7h8m-8 4h8m-8 4h5"/></svg><span>Conhecimento que Nutre</span></a></div>
    <div class="flex items-center gap-2 sm:gap-4"><a href="/paciente.html" class="bg-white/10 hover:bg-orange hover:text-dark px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all">Menu principal</a><button data-theme-toggle type="button" class="bg-white/10 hover:bg-orange hover:text-dark w-9 h-9 rounded-full inline-flex items-center justify-center transition-all" aria-label="Alternar tema"></button><button id="logout-btn" class="bg-white/10 hover:bg-white/20 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all">Sair</button></div>
  </header>
  <main class="min-h-[calc(100vh-4.75rem)] bg-[#17181d] px-4 sm:px-8 lg:px-10 py-6 sm:py-9"><div class="max-w-[1180px] mx-auto"><div class="library-hero mb-7"><p class="text-[9px] uppercase tracking-[0.24em] text-white/75 font-bold mb-1">Área exclusiva do paciente</p><h1 class="text-xl sm:text-2xl font-bold text-white">Acompanhamento Nutricional</h1><p class="text-xs sm:text-sm text-white/80 mt-1">Ferramentas para apoiar o seu cuidado nutricional.</p></div><section class="resource-grid" aria-label="Recursos de acompanhamento nutricional"><a href="/calculadoras.html" class="resource-card"><div class="resource-cover"><span class="resource-icon"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke-width="1.8"/><path stroke-linecap="round" stroke-width="1.8" d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18h8"/></svg></span></div><div class="resource-copy"><h2 class="font-bold text-base">Calculadoras</h2><p class="text-xs text-muted mt-2">Acesse ferramentas de apoio para acompanhar seus indicadores nutricionais.</p><span class="inline-block mt-5 text-xs font-bold text-orange">Abrir calculadoras →</span></div></a></section></div></main>
  <script type="module">
    import { db, applyPatientTheme, togglePatientTheme } from '/assets/js/db.js';
    (async()=>{applyPatientTheme();document.querySelectorAll('[data-theme-toggle]').forEach(b=>b.addEventListener('click',togglePatientTheme));const session=await db.ready();if(!session||session.role!=='patient'){location.href=session&&session.role==='admin'?'/admin.html':'/login.html';return}document.getElementById('logout-btn').addEventListener('click',async()=>{await db.logout();location.href='/login.html'});})();
  </script>
</body>
</html>
