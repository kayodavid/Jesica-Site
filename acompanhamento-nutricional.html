  <style>
    body{font-family:Poppins,sans-serif;transition:background .2s,color .2s;letter-spacing:-.01em}header{height:76px;backdrop-filter:blur(18px)}.patient-shell{max-width:1540px;margin:0 auto}.library-frame{border-radius:1.75rem;overflow:hidden;margin:1.25rem;box-shadow:0 22px 60px rgba(0,0,0,.2)}.patient-sidebar{padding:1.25rem}.library-hero{position:relative;overflow:hidden;border-radius:1.25rem;padding:.8rem 1.2rem;min-height:92px;background:linear-gradient(115deg,#e7793e,#a9483b 58%,#343044);box-shadow:0 14px 34px rgba(0,0,0,.18)}.library-hero:after{content:'';position:absolute;width:260px;height:260px;right:-70px;top:-110px;border:1px solid rgba(255,255,255,.25);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.05),0 0 0 56px rgba(255,255,255,.035)}.library-hero>*{position:relative;z-index:1}.resource-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}.resource-card{display:flex;flex-direction:column;min-height:220px;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:1.25rem;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.025));box-shadow:0 12px 28px rgba(0,0,0,.16);transition:transform .2s,box-shadow .2s,border-color .2s;cursor:pointer}.resource-card:hover{transform:translateY(-5px);border-color:rgba(244,122,60,.75);box-shadow:0 20px 38px rgba(0,0,0,.28)}.resource-cover{height:124px;background:#30323a;display:flex;align-items:center;justify-content:center}.resource-copy{padding:1rem}.resource-icon{width:54px;height:54px;border-radius:1rem;background:rgba(244,122,60,.18);color:#ff8b47;display:flex;align-items:center;justify-content:center}.side-nav-card{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;padding:.75rem;border-radius:.9rem;color:#b9bbc2;transition:background .2s,color .2s,transform .2s}.side-nav-card:hover{background:rgba(255,255,255,.1);color:#fff;transform:translateX(2px)}.side-nav-card.active{background:linear-gradient(135deg,rgba(244,122,60,.27),rgba(244,122,60,.1));box-shadow:inset 3px 0 #ff8b47;color:#fff}.side-nav-icon{width:2.15rem;height:2.15rem;border-radius:.7rem;background:rgba(244,122,60,.15);color:#ff8b47;display:flex;align-items:center;justify-content:center;flex:none}.side-nav-card.active .side-nav-icon{background:#ff8b47;color:#17181d}.calculator-nav-card{background:rgba(255,255,255,.055);border-radius:1rem}.calculator-nav-card .calculator-arrow{transition:transform .2s}.calculator-nav-card.is-expanded .calculator-arrow{transform:rotate(180deg)}.calculator-side-list{border-top:1px solid rgba(255,255,255,.09);padding:.35rem .65rem .55rem}.calculator-side-link{display:flex;align-items:center;gap:.55rem;padding:.48rem .45rem;border-radius:.55rem;color:#b9bbc2;font-size:.72rem;line-height:1.25;text-align:left;transition:background .2s,color .2s}.calculator-side-link:hover{background:rgba(244,122,60,.16);color:#fff}.calculator-side-icon{width:34px;height:34px;flex:0 0 34px;border-radius:.48rem;background:rgba(244,122,60,.16);color:#ff8b47;display:flex;align-items:center;justify-content:center}.calculator-side-link-title{font-weight:600;display:block}.calculator-side-link-type{font-size:.62rem;color:#a9abb3;display:block;margin-top:.12rem}.calculator-side-empty{padding:.45rem;color:#a9abb3;font-size:.72rem}.scrollbar::-webkit-scrollbar{width:7px}.scrollbar::-webkit-scrollbar-thumb{background:#4b4d56;border-radius:999px}body[data-patient-theme=traditional]{background:#faf8f3;color:#3d3226}body[data-patient-theme=traditional] header{background:rgba(255,255,255,.94);border-color:rgba(61,50,38,.12)}body[data-patient-theme=traditional] main{background:#faf8f3;color:#3d3226}body[data-patient-theme=traditional] aside{background:#fff;border-color:rgba(61,50,38,.12)}body[data-patient-theme=traditional] .resource-card{background:#f7e6d7;border-color:rgba(61,50,38,.13);box-shadow:0 12px 28px rgba(100,73,42,.1)}body[data-patient-theme=traditional] .resource-copy{background:#f7e6d7}body[data-patient-theme=traditional] .resource-card:hover{border-color:#d98045}body[data-patient-theme=traditional] .text-white{color:#3d3226}body[data-patient-theme=traditional] .text-muted{color:#5f554b!important}body[data-patient-theme=traditional] .side-nav-card{color:#6b6257}body[data-patient-theme=traditional] .side-nav-card:hover{background:#fff3e5;color:#3d3226}body[data-patient-theme=traditional] .side-nav-card.active{color:#3d3226;background:#fff0e3;box-shadow:inset 3px 0 #d98045}body[data-patient-theme=traditional] .calculator-side-link{color:#5f554b}body[data-patient-theme=traditional] .calculator-side-link:hover{color:#3d3226;background:#fff3e5}body[data-patient-theme=traditional] .calculator-side-link-type{color:#7a6e61}@media(max-width:640px){.library-frame{margin:.6rem;border-radius:1.25rem}}
  
    .admin-top-nav { background:rgba(255,255,255,.88); border-bottom:1px solid rgba(168,139,54,.18); }
    .admin-top-name { color:#3d3226; font-weight:700; font-size:.84rem; }
    .admin-top-link { display:inline-flex; align-items:center; gap:.45rem; color:#3d3226; font-size:.78rem; font-weight:600; text-decoration:none; transition:color .16s ease, transform .16s ease; cursor:pointer; background:none; border:none; padding:0; }
    .admin-top-link:hover { color:#a88b36; transform:translateY(-1px); }
    .admin-top-divider { width:1px; height:1.1rem; background:rgba(168,139,54,.25); flex-shrink:0; }
    .admin-sun-icon { color:#a88b36; width:1rem; height:1rem; flex-shrink:0; }
    .admin-moon-icon { color:#857865; width:1rem; height:1rem; flex-shrink:0; }
    .theme-switch-pill { position:relative; display:inline-flex; align-items:center; width:2.35rem; height:1.28rem; padding:2px; border-radius:999px; background-color:#3d3226; border:none; cursor:pointer; outline:none; transition:background-color .2s ease; flex-shrink:0; }
    .theme-switch-pill:hover { background-color:#282017; }
    .theme-switch-pill:focus-visible { outline:2px solid #a88b36; outline-offset:2px; }
    .theme-switch-knob { display:block; width:.98rem; height:.98rem; border-radius:999px; background-color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.28); transform:translateX(0); transition:transform .2s cubic-bezier(.23,1,.32,1); }
    body[data-patient-theme='black'] .admin-top-nav, html[data-patient-theme='black'] .admin-top-nav { background:#1e222b; border-color:rgba(255,255,255,.09); }
    body[data-patient-theme='black'] .admin-top-name, html[data-patient-theme='black'] .admin-top-name { color:#f7f8fb; }
    body[data-patient-theme='black'] .admin-top-link, html[data-patient-theme='black'] .admin-top-link { color:#e3e7ee; }
    body[data-patient-theme='black'] .admin-top-link:hover, html[data-patient-theme='black'] .admin-top-link:hover { color:#f0d37a; }
    body[data-patient-theme='black'] .admin-top-divider, html[data-patient-theme='black'] .admin-top-divider { background:rgba(255,255,255,.14); }
    body[data-patient-theme='black'] .admin-sun-icon, html[data-patient-theme='black'] .admin-sun-icon { color:#8b93a0; }
    body[data-patient-theme='black'] .admin-moon-icon, html[data-patient-theme='black'] .admin-moon-icon { color:#f0d37a; }
    body[data-patient-theme='black'] .theme-switch-pill, html[data-patient-theme='black'] .theme-switch-pill { background-color:#a88b36; }
    body[data-patient-theme='black'] .theme-switch-knob, html[data-patient-theme='black'] .theme-switch-knob { transform:translateX(1.05rem); background-color:#fff; }
  </style>
</head>
<body class="bg-dark text-white min-h-screen">
    <nav class="admin-top-nav backdrop-blur-md py-2.5 shadow-sm sticky top-0 z-40">
    <div class="container mx-auto px-4 flex justify-between items-center">
      <div class="flex items-center gap-2 sm:gap-3">
        <button id="mobile-sidebar-btn" class="lg:hidden admin-top-link text-lg px-1.5 py-1" aria-label="Abrir seções">☰</button>
        <a href="/paciente.html"><img data-patient-logo src="/assets/images/logo_sem_fundo.png" class="w-28 sm:w-36" alt="Jessica Melo Nutricionista"></a>
      </div>
      <div class="flex items-center gap-3 sm:gap-4">
        <span id="user-display-name" class="admin-top-name hidden sm:inline">Paciente</span>
        
        <div class="flex items-center gap-1.5">
          <svg class="admin-sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke-width="1.8"/>
            <path stroke-linecap="round" stroke-width="1.8" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <button id="theme-toggle" type="button" class="theme-switch-pill" role="switch" aria-label="Alternar tema">
            <span class="theme-switch-knob"></span>
          </button>
          <svg class="admin-moon-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
          </svg>
        </div>

        <div class="admin-top-divider"></div>

        <a href="/paciente.html" class="admin-top-link">
          <svg class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          <span class="hidden sm:inline">Menu principal</span>
        </a>

        <div class="admin-top-divider"></div>

        <button id="logout-btn" type="button" class="admin-top-link">
          <svg class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </nav>
  <div class="flex min-h-[calc(100vh-4.75rem)] patient-shell library-frame">
    <aside id="sidebar" class="fixed lg:sticky top-[76px] left-0 z-30 w-72 h-[calc(100vh-4.75rem)] bg-[#202126] border-r border-white/5 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 overflow-y-auto scrollbar"><div class="patient-sidebar"><p class="text-[11px] font-bold text-muted uppercase tracking-[0.22em] mb-2">Acompanhamento</p><p class="text-xs text-muted mb-5">Ferramentas de apoio</p><nav class="space-y-2" aria-label="Ferramentas de acompanhamento"><div id="calculator-nav-card" class="calculator-nav-card is-expanded"><button id="calculator-nav-toggle" type="button" class="side-nav-card active" aria-expanded="true" aria-controls="calculator-side-list"><span class="side-nav-icon"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke-width="1.8"/><path stroke-linecap="round" stroke-width="1.8" d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18h8"/></svg></span><span class="min-w-0 flex-1"><span class="block text-sm font-semibold">Calculadoras</span><span class="block text-[11px] text-muted mt-1">Indicadores nutricionais</span></span><svg class="calculator-arrow w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg></button><div id="calculator-side-list" class="calculator-side-list"></div></div><a href="/analise-rotulos" class="side-nav-card"><span class="side-nav-icon"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-13Z"/><path stroke-linecap="round" stroke-width="1.8" d="M8 7h8M8 11h8M8 15h4"/></svg></span><span class="min-w-0 flex-1"><span class="block text-sm font-semibold">Análise de Rótulos</span><span class="block text-[11px] text-muted mt-1">Informações de produtos</span></span></a></nav></div></aside>
    <main class="flex-1 min-w-0 bg-[#17181d]"><div class="px-4 sm:px-8 lg:px-10 py-6 sm:py-9 max-w-[1180px] mx-auto"><div class="library-hero mb-7"><p class="text-[9px] uppercase tracking-[0.24em] text-white/75 font-bold mb-1">Área exclusiva do paciente</p><h1 class="text-xl sm:text-2xl font-bold text-white">Ferramentas Nutricionais</h1><p class="text-xs sm:text-sm text-white/80 mt-1">Ferramentas para apoiar o seu cuidado nutricional.</p></div><section id="nutrition-resources" class="resource-grid" aria-label="Recursos de acompanhamento nutricional"></section><p id="no-nutrition-resources" class="hidden text-sm text-muted">Nenhuma calculadora foi habilitada para você ainda.</p></div></main>
  </div>
  <script type="module">
    import { db, applyPatientTheme, togglePatientTheme } from '/assets/js/db.js';
    const calculatorIcon = '<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke-width="1.8"/><path stroke-linecap="round" stroke-width="1.8" d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18h8"/></svg>';
    const calculatorTypeLabel = { bmi: 'Índice de Massa Corporal (IMC)', waist_height: 'Relação cintura/estatura' };
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[character]));
    const labelIcon = '<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-13Z"/><path stroke-linecap="round" stroke-width="1.8" d="M8 7h8M8 11h8M8 15h4"/></svg>';
    function renderNutritionResources(calculators) { const container = document.getElementById('nutrition-resources'); const empty = document.getElementById('no-nutrition-resources'); container.innerHTML = ''; empty.classList.add('hidden'); if (calculators.length) { const calculatorCard = document.createElement('a'); calculatorCard.href = '/calculadoras'; calculatorCard.className = 'resource-card'; calculatorCard.innerHTML = `<div class="resource-cover"><span class="resource-icon">${calculatorIcon}</span></div><div class="resource-copy"><p class="text-[10px] uppercase tracking-[.16em] font-bold text-orange">Ferramentas de apoio</p><h2 class="font-bold text-base mt-1">Calculadoras</h2><p class="text-xs text-muted mt-2">Acesse as calculadoras disponibilizadas para o seu acompanhamento nutricional.</p><span class="inline-block mt-5 text-xs font-bold text-orange">Abrir calculadoras →</span></div>`; container.appendChild(calculatorCard); } const labelCard = document.createElement('a'); labelCard.href = '/analise-rotulos'; labelCard.className = 'resource-card'; labelCard.innerHTML = `<div class="resource-cover"><span class="resource-icon">${labelIcon}</span></div><div class="resource-copy"><p class="text-[10px] uppercase tracking-[.16em] font-bold text-orange">Ferramentas de apoio</p><h2 class="font-bold text-base mt-1">Análise de Rótulos</h2><p class="text-xs text-muted mt-2">Conheça o espaço para consulta e leitura de informações de produtos.</p><span class="inline-block mt-5 text-xs font-bold text-orange">Abrir análise de rótulos →</span></div>`; container.appendChild(labelCard); }
    function renderCalculatorSidebar(calculators) { const list = document.getElementById('calculator-side-list'); list.innerHTML = ''; if (!calculators.length) { list.innerHTML = '<p class="calculator-side-empty">Nenhuma calculadora disponível.</p>'; return; } calculators.forEach(calculator => { const link = document.createElement('a'); link.href = `/calculadoras?calculator=${encodeURIComponent(calculator.id)}`; link.className = 'calculator-side-link'; link.innerHTML = `<span class="calculator-side-icon">${calculatorIcon.replace('w-7 h-7', 'w-4 h-4')}</span><span class="min-w-0"><span class="calculator-side-link-title">${escapeHtml(calculator.title)}</span><span class="calculator-side-link-type">${escapeHtml(calculatorTypeLabel[calculator.calculatorType] || 'Calculadora')}</span></span>`; list.appendChild(link); }); }
    (async()=>{applyPatientTheme();document.querySelectorAll('[data-theme-toggle]').forEach(b=>b.addEventListener('click',togglePatientTheme));const session=await db.ready();if(!session||session.role!=='patient'){location.href=session&&session.role==='admin'?'/admin.html':'/login.html';return}if(!(await db.hasPatientAccess('nutrition',session.email))){location.href='/paciente.html';return}const sidebar=document.getElementById('sidebar');document.getElementById('mobile-sidebar-btn').addEventListener('click',()=>sidebar.classList.toggle('-translate-x-full'));document.getElementById('logout-btn').addEventListener('click',async()=>{await db.logout();location.href='/login.html'});const navCard=document.getElementById('calculator-nav-card');const navToggle=document.getElementById('calculator-nav-toggle');navToggle.addEventListener('click',()=>{const expanded=navCard.classList.toggle('is-expanded');document.getElementById('calculator-side-list').classList.toggle('hidden',!expanded);navToggle.setAttribute('aria-expanded',String(expanded));});const calculators=await db.getPublishedPatientCalculators();renderNutritionResources(calculators);renderCalculatorSidebar(calculators);})();
  </script>
