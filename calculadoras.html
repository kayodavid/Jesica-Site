<head>

  <script src="https://cdn.tailwindcss.com"></script><link rel="icon" type="image/jpeg" href="/assets/images/Jessica-site2.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" /><script>tailwind.config={theme:{extend:{colors:{primary:'#f47a3c',orange:'#ff8b47',dark:'#17181d',panel:'#22242b',muted:'#a9abb3'}}}};</script>
  <style>body{font-family:Poppins,sans-serif;transition:background .2s,color .2s;letter-spacing:-.01em}header{height:76px;backdrop-filter:blur(18px)}.library-hero{position:relative;overflow:hidden;border-radius:1.25rem;padding:.8rem 1.2rem;min-height:92px;background:linear-gradient(115deg,#e7793e,#a9483b 58%,#343044);box-shadow:0 14px 34px rgba(0,0,0,.18)}.library-hero:after{content:'';position:absolute;width:260px;height:260px;right:-70px;top:-110px;border:1px solid rgba(255,255,255,.25);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.05),0 0 0 56px rgba(255,255,255,.035)}.library-hero>*{position:relative;z-index:1}.empty-panel{border:1px solid rgba(255,255,255,.09);border-radius:1.25rem;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.025));box-shadow:0 12px 28px rgba(0,0,0,.16)}body[data-patient-theme=traditional]{background:#faf8f3;color:#3d3226}body[data-patient-theme=traditional] header{background:rgba(255,255,255,.94);border-color:rgba(61,50,38,.12)}body[data-patient-theme=traditional] main{background:#faf8f3;color:#3d3226}body[data-patient-theme=traditional] .empty-panel{background:#fff;border-color:rgba(61,50,38,.13);box-shadow:0 12px 28px rgba(100,73,42,.1)}body[data-patient-theme=traditional] .text-white{color:#3d3226}body[data-patient-theme=traditional] .text-muted{color:#5f554b!important}</style>
</head>
<body class="bg-dark text-white min-h-screen"><header class="bg-[#1d1e24] border-b border-white/5 flex items-center justify-between px-4 sm:px-7 sticky top-0 z-40"><div class="flex items-center gap-2 sm:gap-3"><a href="/paciente.html" class="block"><img data-patient-logo src="/assets/images/Logomarca_nobg_branco.png" class="w-32 sm:w-40 h-auto max-h-10 object-contain" alt="Jessica Melo Nutricionista"></a><a href="/paciente.html" class="inline-flex items-center gap-2 rounded-lg px-2 py-1.5 text-xs text-muted hover:bg-white/10 hover:text-white transition-all"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M4 5.5v16M8 7h8m-8 4h8m-8 4h5"/></svg><span>Conhecimento que Nutre</span></a></div><div class="flex items-center gap-2 sm:gap-4"><a href="/acompanhamento-nutricional.html" class="bg-white/10 hover:bg-orange hover:text-dark px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all">Acompanhamento</a><button data-theme-toggle type="button" class="bg-white/10 hover:bg-orange hover:text-dark w-9 h-9 rounded-full inline-flex items-center justify-center transition-all" aria-label="Alternar tema"></button><button id="logout-btn" class="bg-white/10 hover:bg-white/20 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all">Sair</button></div></header><main class="min-h-[calc(100vh-4.75rem)] bg-[#17181d] px-4 sm:px-8 lg:px-10 py-6 sm:py-9"><div class="max-w-[1180px] mx-auto"><div class="library-hero mb-7"><p class="text-[9px] uppercase tracking-[0.24em] text-white/75 font-bold mb-1">Acompanhamento Nutricional</p><h1 class="text-xl sm:text-2xl font-bold text-white">Calculadoras</h1><p class="text-xs sm:text-sm text-white/80 mt-1">Ferramentas de apoio para o seu acompanhamento.</p></div><section class="empty-panel p-8 sm:p-12 text-center"><div class="mx-auto w-14 h-14 rounded-2xl bg-orange/15 text-orange flex items-center justify-center mb-5"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke-width="1.8"/><path stroke-linecap="round" stroke-width="1.8" d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18h8"/></svg></div><h2 class="text-lg font-bold">Calculadoras</h2><p class="text-sm text-muted mt-2 max-w-lg mx-auto">Este espaço está preparado para receber as calculadoras do seu acompanhamento nutricional.</p></section></div></main><script type="module">import{db,applyPatientTheme,togglePatientTheme}from'/assets/js/db.js';(async()=>{applyPatientTheme();document.querySelectorAll('[data-theme-toggle]').forEach(b=>b.addEventListener('click',togglePatientTheme));const s=await db.ready();if(!s||s.role!=='patient'){location.href=s&&s.role==='admin'?'/admin.html':'/login.html';return}document.getElementById('logout-btn').addEventListener('click',async()=>{await db.logout();location.href='/login.html'});})();</script></body></html>
