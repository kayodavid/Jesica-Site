<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Responder questionário | Jessica Melo Nutricionista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold:#a88b36; --gold-light:#f5e6c8; --gold-soft:#fffaf0;
      --ink:#3d3226; --muted:#766c5f; --line:#e8dfd0;
      --surface:#fff; --bg:#faf8f3;
      --danger:#b23b3b; --success:#267a55;
      --radius:20px; --radius-sm:12px;
      --shadow:0 12px 40px rgba(61,50,38,.09);
    }
    *, *::before, *::after { box-sizing:border-box; }
    html, body { margin:0; height:100%; }
    body { min-height:100dvh; background:var(--bg); color:var(--ink); font-family:Poppins,Arial,sans-serif; -webkit-font-smoothing:antialiased; }

    /* STATE */
    #app-state { display:flex; align-items:center; justify-content:center; min-height:100dvh; padding:24px; }
    .state-card { width:min(520px,100%); background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:48px 36px; text-align:center; }
    .state-symbol { display:grid; place-items:center; width:60px; height:60px; margin:0 auto 20px; border-radius:18px; background:#f8ecd1; color:var(--gold); font-size:26px; }
    .state-card h1 { margin:0 auto; font-size:clamp(20px,4vw,26px); line-height:1.3; }
    .state-card p { max-width:400px; margin:12px auto 0; color:var(--muted); font-size:14px; line-height:1.7; }
    .state-card.success .state-symbol { background:#dff4e8; color:var(--success); }
    .state-card.error   .state-symbol { background:#fbe4e4; color:var(--danger); }
    .result-score { display:flex; align-items:center; justify-content:center; gap:16px; margin:28px auto 0; padding:18px 20px; max-width:340px; border:1px solid var(--line); border-radius:16px; background:#fffdf8; text-align:left; }
    .result-score .result-emoji { display:grid; place-items:center; width:50px; height:50px; border-radius:14px; background:#fff4d5; font-size:28px; flex:0 0 auto; }
    .result-score small  { display:block; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .result-score strong { display:block; margin-top:3px; color:var(--gold); font-size:28px; line-height:1.1; }
    .result-score span:last-child { display:block; margin-top:4px; color:var(--ink); font-size:12px; font-weight:700; }

    /* QUIZ WRAP */
    #quiz-wrap { display:none; flex-direction:column; min-height:100dvh; }
    #quiz-wrap.active { display:flex; }

    /* HEADER */
    .quiz-header { position:sticky; top:0; z-index:10; background:rgba(250,248,243,.92); backdrop-filter:blur(10px); border-bottom:1px solid rgba(232,223,208,.6); padding:12px 20px; }
    .quiz-header-inner { display:flex; align-items:center; gap:12px; width:min(680px,100%); margin:0 auto; }
    .quiz-brand { display:flex; align-items:center; gap:8px; color:var(--gold); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; flex:0 0 auto; }
    .quiz-brand-icon { display:grid; place-items:center; width:26px; height:26px; border-radius:8px; background:var(--gold); color:#fff; font-size:13px; }
    .quiz-progress-wrap { flex:1; min-width:0; }
    .quiz-step-label { font-size:11px; font-weight:600; color:var(--muted); margin-bottom:5px; }
    .quiz-progress-bar { height:5px; background:#ede6dc; border-radius:999px; overflow:hidden; }
    .quiz-progress-fill { height:100%; background:var(--gold); border-radius:inherit; transition:width .4s cubic-bezier(.4,0,.2,1); }

    /* DOTS */
    .quiz-dots { display:flex; gap:5px; flex-wrap:wrap; }
    .quiz-dot { width:7px; height:7px; border-radius:50%; background:var(--line); transition:background .3s, transform .2s; }
    .quiz-dot.done    { background:rgba(168,139,54,.45); }
    .quiz-dot.current { background:var(--gold); transform:scale(1.35); }

    /* STAGE */
    .quiz-stage { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:28px 16px 40px; overflow:hidden; position:relative; }

    /* SLIDES */
    .quiz-slide { position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; padding:28px 16px 40px; opacity:0; pointer-events:none; user-select:none; transition:opacity .32s ease, transform .32s cubic-bezier(.4,0,.2,1); transform:translateX(60px); }
    .quiz-slide.active { position:relative; opacity:1; pointer-events:auto; user-select:auto; transform:translateX(0); }
    .quiz-slide.exit-left  { transform:translateX(-60px); opacity:0; }
    .quiz-slide.exit-right { transform:translateX(60px);  opacity:0; }
    .quiz-slide.enter-left  { transform:translateX(-60px); opacity:0; }
    .quiz-slide.enter-right { transform:translateX(60px);  opacity:0; }
    .slide-inner { width:min(580px,100%); display:flex; flex-direction:column; gap:0; }

    /* COVER */
    .cover-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:36px 32px; overflow:hidden; position:relative; }
    .cover-card::before { content:""; position:absolute; width:260px; height:260px; border-radius:50%; right:-130px; top:-160px; background:var(--gold-light); opacity:.6; pointer-events:none; }
    .cover-eyebrow { position:relative; z-index:1; margin:0 0 10px; color:var(--gold); font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
    .cover-title { position:relative; z-index:1; margin:0; font-size:clamp(22px,5vw,32px); line-height:1.25; }
    .cover-desc  { position:relative; z-index:1; margin:14px 0 0; color:var(--muted); font-size:14px; line-height:1.7; }
    .cover-meta  { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; position:relative; z-index:1; }
    .cover-badge { display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px; background:#fdf7ea; color:#715b25; font-size:12px; font-weight:600; }
    .cover-start-wrap { margin-top:28px; position:relative; z-index:1; }
    .btn-start { display:inline-flex; align-items:center; gap:8px; padding:14px 28px; border:0; border-radius:var(--radius-sm); background:var(--gold); color:#fff; font:inherit; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 8px 20px rgba(168,139,54,.28); transition:transform .18s, box-shadow .18s; }
    .btn-start:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(168,139,54,.34); }
    .cover-count { display:block; margin-top:10px; color:var(--muted); font-size:12px; }

    /* CONTEXT BLOCK */
    .context-block { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .context-block-header { display:flex; align-items:flex-start; gap:12px; padding:22px 24px 0; }
    .context-block-icon { display:grid; flex:0 0 auto; place-items:center; width:38px; height:38px; border-radius:12px; background:#fbf5e7; color:var(--gold); font-size:20px; }
    .context-block-eyebrow { margin:2px 0 4px; color:var(--gold); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .context-block-title   { margin:0; font-size:17px; line-height:1.4; }
    .context-block-body    { padding:14px 24px 22px; color:#4e4438; font-size:14px; line-height:1.65; }
    .context-block-body p  { margin:0 0 8px; }
    .context-block-image   { display:block; width:calc(100% - 48px); max-height:320px; margin:0 24px 22px; border:1px solid var(--line); border-radius:13px; object-fit:cover; }

    /* QUESTION CARD */
    .question-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px 28px 24px; }
    .question-top  { display:flex; align-items:flex-start; gap:14px; }
    .question-icon { display:grid; flex:0 0 auto; place-items:center; width:42px; height:42px; border-radius:14px; background:#fbf5e7; color:var(--gold); font-size:22px; }
    .question-code  { margin:2px 0 5px; color:var(--gold); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .question-title { margin:0; font-size:17px; line-height:1.45; }
    .required { margin-left:4px; color:var(--danger); }
    .rich-text { margin:14px 0 0 56px; color:#4e4438; font-size:14px; line-height:1.65; }
    .rich-text p      { margin:0 0 8px; }
    .rich-text strong { font-weight:700; }
    .rich-text em     { font-style:italic; }
    .rich-text u      { text-decoration:underline; }
    .question-image { display:block; max-width:calc(100% - 56px); max-height:280px; margin:16px 0 0 56px; border-radius:12px; border:1px solid var(--line); object-fit:cover; }
    .answer-area { margin:22px 0 0 56px; }

    /* ERROR */
    .q-error { display:none; margin:12px 0 0 56px; color:var(--danger); font-size:12px; font-weight:600; }
    .question-card.is-invalid { border-color:#d98989; }
    .question-card.is-invalid .q-error { display:block; }

    /* CHOICES */
    .choice { display:flex; align-items:flex-start; gap:11px; width:100%; margin:9px 0; padding:13px 14px; border:1px solid var(--line); border-radius:var(--radius-sm); cursor:pointer; transition:border-color .16s, background .16s, transform .14s; }
    .choice:hover { border-color:#c6ad6d; background:#fffdf8; }
    .choice:has(input:checked) { border-color:var(--gold); background:var(--gold-soft); }
    .choice input { margin:3px 0 0; accent-color:var(--gold); flex:0 0 auto; }
    .choice span  { color:#4e4438; font-size:14px; line-height:1.45; }
    textarea, input[type="number"], input[type="text"] { width:100%; min-height:48px; padding:13px 14px; border:1px solid var(--line); border-radius:var(--radius-sm); outline:none; color:var(--ink); font:inherit; font-size:14px; background:#fff; transition:border-color .16s, box-shadow .16s; }
    textarea { min-height:120px; resize:vertical; }
    textarea:focus, input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(168,139,54,.14); }
    .unit { margin:8px 0 0; color:var(--muted); font-size:12px; }
    .linear-scale { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:7px; margin-top:12px; width:100%; }
    .linear-scale label { display:grid; place-items:center; flex:1 1 38px; min-width:34px; max-width:56px; min-height:42px; border:1px solid var(--line); border-radius:10px; cursor:pointer; font-size:14px; font-weight:600; transition:transform .14s, border-color .14s, background .14s; }
    .linear-scale label:hover { border-color:rgba(168,139,54,.45); transform:translateY(-1px); }
    .linear-scale label:has(input:checked) { color:#fff; background:var(--gold); border-color:var(--gold); }
    .linear-scale input { position:absolute; opacity:0; pointer-events:none; }
    .scale-labels { display:flex; justify-content:space-between; gap:18px; margin-top:8px; color:var(--muted); font-size:11px; }
    .emoji-scale { display:flex; flex-wrap:wrap; gap:9px; justify-content:center; }
    .emoji-scale label { display:grid; place-items:center; min-width:56px; min-height:56px; border:2px solid var(--line); border-radius:14px; cursor:pointer; transition:transform .14s, border-color .14s, background .14s; padding:6px 8px; text-align:center; }
    .emoji-scale label:hover { transform:translateY(-2px); border-color:rgba(168,139,54,.45); }
    .emoji-scale label:has(input:checked) { border-color:var(--gold); background:#fff6dd; }
    .emoji-scale input { position:absolute; opacity:0; pointer-events:none; }
    .emoji-scale .es-glyph { display:block; font-size:26px; line-height:1; }
    .emoji-scale .es-label { display:block; margin-top:4px; font-size:11px; font-weight:600; color:#5a4e3a; line-height:1.3; max-width:72px; word-break:break-word; }
    .emoji-scale.mode-emoji-only label { width:52px; height:52px; min-width:52px; min-height:52px; border-radius:14px; padding:0; }
    .emoji-scale.mode-emoji-only .es-glyph { font-size:28px; }
    .emoji-scale.mode-emoji-only .es-label { display:none; }
    .emoji-scale.mode-text-only label { min-width:0; width:auto; height:auto; min-height:40px; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600; color:#3d3226; }
    .emoji-scale.mode-text-only .es-glyph { display:none; }
    .emoji-scale.mode-text-only .es-label { display:block; font-size:13px; font-weight:600; color:#3d3226; margin:0; max-width:none; }
    .emoji-scale.mode-text-only { flex-direction:column; align-items:stretch; gap:7px; }
    .emoji-scale.mode-text-only label { display:flex; align-items:center; justify-content:center; }
    .file-input { width:100%; padding:12px; border:1px dashed #cbbd9c; border-radius:12px; background:#fffcf5; color:#5f533f; font:inherit; font-size:13px; }
    .file-note  { margin:8px 0 0; color:var(--muted); font-size:11px; }
    .clarification-card { margin-top:16px; padding:14px 15px; border:1px solid #d8c58e; border-radius:13px; background:#fffaf0; }
    .clarification-card label    { display:block; color:var(--ink); font-size:13px; font-weight:700; line-height:1.45; }
    .clarification-card textarea { min-height:88px; margin-top:8px; background:#fff; }
    .clarification-card p        { margin:7px 0 0; color:var(--muted); font-size:11px; line-height:1.5; }

    /* NAV BUTTONS */
    .quiz-nav { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:20px; }
    .btn-nav  { display:inline-flex; align-items:center; gap:7px; padding:12px 20px; border-radius:var(--radius-sm); font:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:transform .16s, box-shadow .16s, background .16s; }
    .btn-prev { border:1.5px solid var(--line); background:var(--surface); color:var(--muted); }
    .btn-prev:hover { border-color:#c6ad6d; color:var(--gold); transform:translateY(-1px); }
    .btn-next { border:0; background:var(--gold); color:#fff; box-shadow:0 6px 18px rgba(168,139,54,.25); margin-left:auto; }
    .btn-next:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(168,139,54,.32); }
    .btn-next:disabled { opacity:.55; cursor:not-allowed; transform:none; box-shadow:none; }

    /* REVIEW */
    .review-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px; }
    .review-card h2 { margin:0 0 4px; font-size:20px; }
    .review-card > p { margin:0 0 22px; color:var(--muted); font-size:13px; }
    .review-list { display:flex; flex-direction:column; gap:10px; margin-bottom:24px; }
    .review-item { padding:14px 16px; border:1px solid var(--line); border-radius:14px; background:#fffdf8; }
    .review-item-q { font-size:11px; font-weight:700; color:var(--gold); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
    .review-item-a { font-size:14px; color:var(--ink); font-weight:600; margin:0; }
    .review-item-empty { font-size:13px; color:var(--muted); font-style:italic; margin:0; }
    .review-footer { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; border-top:1px solid var(--line); padding-top:20px; }
    .review-footer p { margin:0; max-width:340px; color:var(--muted); font-size:11px; line-height:1.55; }
    .btn-submit { border:0; background:var(--gold); color:#fff; box-shadow:0 6px 18px rgba(168,139,54,.25); padding:14px 28px; border-radius:var(--radius-sm); font:inherit; font-size:14px; font-weight:700; cursor:pointer; transition:transform .16s, box-shadow .16s; }
    .btn-submit:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(168,139,54,.32); }
    .btn-submit:disabled { opacity:.6; cursor:not-allowed; transform:none; box-shadow:none; }

    .hidden { display:none !important; }

    @media (max-width:600px) {
      .quiz-stage { padding:16px 10px 32px; }
      .quiz-slide  { padding:16px 10px 32px; }
      .cover-card  { padding:22px 18px; }
      .question-card { padding:18px 16px 16px; }
      .review-card   { padding:18px; }
      .rich-text, .answer-area, .q-error { margin-left:0; }
      .question-image { max-width:100%; margin-left:0; }
      .linear-scale label { flex:1 1 calc(20% - 5px); min-width:30px; min-height:38px; font-size:13px; }
      .quiz-brand-name { display:none; }
    }
  </style>
</head>
<body>

  <div id="app-state">
    <section class="state-card">
      <div class="state-symbol">…</div>
      <h1>Preparando seu questionário</h1>
      <p>Estamos carregando o convite de forma segura.</p>
    </section>
  </div>

  <div id="quiz-wrap">
    <header class="quiz-header">
      <div class="quiz-header-inner">
        <div class="quiz-brand">
          <span class="quiz-brand-icon">✦</span>
          <span class="quiz-brand-name">Jessica Melo</span>
        </div>
        <div class="quiz-progress-wrap">
          <p class="quiz-step-label" id="step-label">Carregando…</p>
          <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="progress-fill" style="width:0%"></div></div>
        </div>
        <div class="quiz-dots" id="quiz-dots"></div>
      </div>
    </header>
    <div class="quiz-stage" id="quiz-stage"></div>
  </div>

  <script>
    const endpoint = '/api/questionnaire-email';
    const token = new URLSearchParams(location.search).get('token') || '';
    const state = { invitation:null, steps:[], currentStep:0, answers:{}, progressTimer:null, submitted:false, navigating:false };

    function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    function usable(v=''){const t=String(v??'').trim();return t&&!/^(undefined|null)$/i.test(t)?t:'';}
    function safeUrl(v=''){const r=usable(v);if(!r)return '';if(/^data:/i.test(r))return /^data:image\/(png|jpe?g|webp);base64,/i.test(r)?r:'';try{const u=new URL(r,location.origin);return['https:','http:'].includes(u.protocol)?u.href:'';}catch{return '';}}
    function sanitize(v=''){const t=document.createElement('template');t.innerHTML=usable(v);const ok=new Set(['P','DIV','BR','STRONG','B','EM','I','U','UL','OL','LI','SPAN']);const vc=c=>/^((#[0-9a-f]{3,8})|(rgb|hsl)a?\([^)]{1,80}\))$/i.test(String(c||'').trim());const w=document.createTreeWalker(t.content,NodeFilter.SHOW_ELEMENT);const n=[];while(w.nextNode())n.push(w.currentNode);n.forEach(x=>{if(!ok.has(x.tagName)){x.replaceWith(...x.childNodes);return;}const c=x.tagName==='SPAN'?x.style.color:'';[...x.attributes].forEach(a=>x.removeAttribute(a.name));if(x.tagName==='SPAN'&&vc(c))x.style.color=c;});return t.innerHTML;}
    function dateFmt(v){try{const d=new Date(v);const dateStr=new Intl.DateTimeFormat('pt-BR',{dateStyle:'long',timeZone:'America/Sao_Paulo'}).format(d);const timeStr=new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Sao_Paulo'}).format(d);return `${dateStr} às ${timeStr}`;}catch{return '';}}
    function scoreBand(p){const v=Number(p);if(!Number.isFinite(v))return{label:'Sem avaliação',emoji:'—'};if(v>=80)return{label:'Ótimo',emoji:'🤩'};if(v>=60)return{label:'Bom',emoji:'😊'};if(v>=40)return{label:'Neutro',emoji:'😐'};if(v>=20)return{label:'Ruim',emoji:'😟'};return{label:'Péssimo',emoji:'😭'};}
    async function req(action,body={},opts={}){const r=await fetch(endpoint,{method:'POST',cache:'no-store',credentials:'same-origin',keepalive:action==='click'||opts.keepalive===true,headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...body})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Não foi possível processar sua solicitação.');return d;}

    function getOptions(q){return Array.isArray(q.options)?q.options.filter(Boolean):[];}
    function optSetting(q,opt){const t=String(opt??'');return Array.isArray(q.optionSettings)?q.optionSettings.find(i=>['text','option','label','emoji','value'].some(k=>String(i?.[k]??'')===t))||null:null;}
    function optScore(q,opt){return Number(optSetting(q,opt)?.score??0)||0;}
    function optLabel(q,opt){const f=optSetting(q,opt);return String(f?.evaluationLabel??f?.ratingLabel??f?.evaluation??f?.rating??(q.type==='emoji'?f?.text:'')?? opt??'').trim();}
    function optEmoji(q,opt){const f=optSetting(q,opt);return String(f?.evaluationEmoji??f?.ratingEmoji??f?.emoji??(q.type==='emoji'?opt:'')??'').trim();}
    function scoreCfg(quiz,q){const id=typeof q==='object'?q?.id:q;const c=quiz?.questionSettings?.[id]||{};const w=Math.round(Number(c.weight));const fb=typeof q==='object'?q?.required!==false:true;return{active:c.active!==false,required:c.required===undefined?fb:c.required!==false,weight:Number.isFinite(w)&&w>=1&&w<=5?w:1};}
    function scaleVals(q){const c=q.scaleConfig||{};const mn=Number.isFinite(Number(c.min))?Number(c.min):0;const mx=Number.isFinite(Number(c.max))?Number(c.max):10;return Array.from({length:Math.max(2,Math.min(11,mx-mn+1))},(_,i)=>mn+i);}
    function clarPrompt(q,val){const t=String(val??'');const s=Array.isArray(q?.optionSettings)?q.optionSettings.find(i=>['value','text','option','label','emoji'].some(k=>String(i?.[k]??'')===t)):null;return String(s?.clarificationPrompt||s?.clarification||s?.followUpQuestion||'').trim();}
    function clarMarkup(q){const id=esc(q.id);return '<div class="clarification-card hidden" data-clarification-for="'+id+'"><label data-clarification-label>Pergunta complementar</label><textarea data-question-clarification="'+id+'" aria-label="Resposta complementar" placeholder="Escreva sua resposta, se desejar."></textarea><p>Esta pergunta aparece conforme a alternativa selecionada.</p></div>';}

    function qText(q){const h=usable(q.questionHtml),t=usable(q.questionText)||usable(q.title);if(!h)return '<p>'+esc(t)+'</p>';if(!/</.test(h))return '<p>'+esc(h).replace(/\r?\n/g,'<br>')+'</p>';return sanitize(h);}
    function renderAnswer(q,idx){
      const name='answer-'+idx,opts=getOptions(q),type=q.type||'single';
      if(type==='open')return '<textarea data-question="'+esc(q.id)+'" aria-label="Resposta" placeholder="Escreva sua resposta"></textarea>';
      if(type==='metric'||type==='number')return '<input data-question="'+esc(q.id)+'" type="number" inputmode="decimal" step="any" aria-label="Resposta numérica" placeholder="Digite um número" /><p class="unit">'+(q.metricUnit?'Unidade: '+esc(q.metricUnit):'Informe somente números.')+'</p>';
      if(type==='photo')return '<input data-question="'+esc(q.id)+'" class="file-input" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Enviar foto" /><p class="file-note">Envie uma imagem em JPG, PNG ou WebP de até 2 MB.</p>';
      if(type==='linear'){const c=q.scaleConfig||{},vals=scaleVals(q);return '<div class="linear-scale">'+vals.map(v=>'<label title="'+esc(optLabel(q,v))+'"><input type="radio" name="'+name+'" value="'+v+'" data-question="'+esc(q.id)+'" data-label="'+esc(optLabel(q,v)||v)+'" data-score="'+optScore(q,v)+'" data-rating-emoji="'+esc(optEmoji(q,v))+'" />'+v+'</label>').join('')+'</div><div class="scale-labels"><span>'+esc(c.minLabel||'Menor')+'</span><span>'+esc(c.maxLabel||'Maior')+'</span></div>'+clarMarkup(q);}
      if(type==='emoji'){const mode=state.invitation?.emojiScaleDisplayMode||'emoji-text';const items=opts.map((o,i)=>{const s=optSetting(q,o)||(Array.isArray(q.optionSettings)?q.optionSettings[i]:null);const emoji=String(s?.emoji||s?.evaluationEmoji||s?.ratingEmoji||['😭','😟','😐','😊','🤩'][Math.min(i,4)]||'😊').trim();const label=String(o||s?.text||s?.label||'').trim();return{emoji,label,raw:o};});return '<div class="emoji-scale mode-'+esc(mode)+'">'+items.map(it=>'<label title="'+esc(it.label||it.emoji)+'"><input type="radio" name="'+name+'" value="'+esc(it.raw)+'" data-question="'+esc(q.id)+'" data-label="'+esc(it.label)+'" data-score="'+optScore(q,it.raw)+'" data-rating-emoji="'+esc(it.emoji)+'" /><span class="es-glyph" aria-hidden="true">'+esc(it.emoji)+'</span><span class="es-label">'+esc(it.label)+'</span></label>').join('')+'</div>'+clarMarkup(q);}
      return '<div>'+opts.map(o=>'<label class="choice"><input type="radio" name="'+name+'" value="'+esc(o)+'" data-question="'+esc(q.id)+'" data-label="'+esc(optLabel(q,o)||o)+'" data-score="'+optScore(q,o)+'" data-rating-emoji="'+esc(optEmoji(q,o))+'" /><span>'+esc(o)+'</span></label>').join('')+'</div>'+clarMarkup(q);
    }

    function curVal(q){
      const inp=document.querySelector('[data-question="'+CSS.escape(q.id)+'"]');if(!inp)return null;
      if(q.type==='single'||q.type==='linear'||q.type==='emoji'){const sel=document.querySelector('[data-question="'+CSS.escape(q.id)+'"]:checked');return sel?{value:sel.value,label:sel.dataset.label||sel.value,evaluationEmoji:sel.dataset.ratingEmoji||'',score:Number(sel.dataset.score||0)||0}:null;}
      if(q.type==='photo'){const f=inp.files?.[0];return f?{file:f}:null;}
      const v=String(inp.value||'').trim();return v?{value:v,label:v,score:0}:null;
    }
    function readClarResp(q,val){const p=clarPrompt(q,val);if(!p)return '';const ta=document.querySelector('[data-question-clarification="'+CSS.escape(q.id)+'"]');return String(ta?.value||'').trim();}
    function updateClarifications(){
      const qs=state.invitation?.quiz?.questionSnapshots||[];
      qs.forEach(q=>{const box=document.querySelector('[data-clarification-for="'+CSS.escape(q.id)+'"]');if(!box)return;const sel=document.querySelector('[data-question="'+CSS.escape(q.id)+'"]:checked');const p=sel?clarPrompt(q,sel.value):'';const ta=box.querySelector('[data-question-clarification]'),lb=box.querySelector('[data-clarification-label]');if(p){lb.textContent=p;box.classList.remove('hidden');}else{if(ta)ta.value='';box.classList.add('hidden');}});
    }

    function progressSnap(){const qs=state.invitation?.quiz?.questionSnapshots||[];return{total:qs.length,answered:qs.filter(q=>curVal(q)).length};}
    function renderHeader(){
      const qSteps=state.steps.filter(s=>s.type==='question');const total=qSteps.length;if(!total)return;
      const step=state.steps[state.currentStep];const isReview=step?.type==='review';const isCover=step?.type==='cover';
      const answered=qSteps.filter(s=>curVal(s.data)).length;const pct=total?Math.round((answered/total)*100):0;
      const lbl=document.getElementById('step-label'),fill=document.getElementById('progress-fill'),dots=document.getElementById('quiz-dots');
      if(isCover){if(lbl)lbl.textContent=total+' pergunta'+(total===1?'':'s');if(fill)fill.style.width='0%';}
      else if(isReview){if(lbl)lbl.textContent='Revisão final';if(fill)fill.style.width='100%';}
      else{const qIdx=qSteps.indexOf(step)+1;if(lbl)lbl.textContent='Pergunta '+qIdx+' de '+total;if(fill)fill.style.width=pct+'%';}
      if(dots){dots.innerHTML=qSteps.map((s,i)=>{const done=curVal(s.data);let c='quiz-dot';if(s===step)c+=' current';else if(done)c+=' done';return '<span class="'+c+'" title="Pergunta '+(i+1)+'"></span>';}).join('');}
    }
    async function saveProgress(){if(state.submitted||!token)return;const p=progressSnap();if(!p.answered)return;try{await req('progress',{token,answeredQuestions:p.answered,totalQuestions:p.total});}catch{}}
    function trackProgress(){renderHeader();clearTimeout(state.progressTimer);state.progressTimer=setTimeout(saveProgress,650);}

    function getSlide(i){return document.getElementById('slide-'+i);}
    function goTo(next,dir){
      if(state.navigating||next===state.currentStep||next<0||next>=state.steps.length)return;
      state.navigating=true;
      const cur=getSlide(state.currentStep),nxt=getSlide(next);
      if(!cur||!nxt){state.currentStep=next;state.navigating=false;renderHeader();return;}
      const exitCls=dir==='forward'?'exit-left':'exit-right';
      const enterCls=dir==='forward'?'enter-right':'enter-left';
      nxt.classList.remove('exit-left','exit-right','enter-left','enter-right','active');
      nxt.classList.add(enterCls);nxt.style.position='absolute';nxt.style.pointerEvents='none';
      requestAnimationFrame(()=>{requestAnimationFrame(()=>{
        cur.classList.add(exitCls);cur.classList.remove('active');
        nxt.classList.remove(enterCls);nxt.classList.add('active');
        nxt.style.position='';nxt.style.pointerEvents='';
        state.currentStep=next;renderHeader();
        if(next===state.steps.findIndex(s=>s.type==='review'))refreshReview();
        setTimeout(()=>{cur.classList.remove(exitCls,'active');state.navigating=false;window.scrollTo({top:0,behavior:'smooth'});},340);
      });});
    }
    function goNext(){
      const step=state.steps[state.currentStep];
      if(step?.type==='question'){
        const q=step.data;const card=document.querySelector('[data-card="'+CSS.escape(q.id)+'"]');const val=curVal(q);
        card?.classList.remove('is-invalid');
        if(q.required!==false&&!val){card?.classList.add('is-invalid');card?.scrollIntoView({behavior:'smooth',block:'center'});return;}
      }
      goTo(state.currentStep+1,'forward');
    }
    function goPrev(){goTo(state.currentStep-1,'backward');}

    function buildSteps(inv){
      const quiz=inv.quiz||{};const snaps=Array.isArray(quiz.questionSnapshots)?quiz.questionSnapshots:[];
      const ctx=Array.isArray(quiz.contextBlocks)?quiz.contextBlocks:[];const steps=[];
      steps.push({type:'cover',data:{quiz,invitation:inv}});
      ctx.forEach(b=>steps.push({type:'context',data:b}));
      snaps.forEach((q,i)=>steps.push({type:'question',data:q,index:i}));
      steps.push({type:'review',data:{quiz,snapshots:snaps}});
      return steps;
    }

    function slideCover(step,si){
      const{quiz,invitation}=step.data;const total=state.steps.filter(s=>s.type==='question').length;
      return '<div class="slide-inner"><div class="cover-card"><p class="cover-eyebrow">Ferramentas Nutricionais</p><h1 class="cover-title">'+esc(quiz.title||invitation.quiz_title||'Questionário')+'</h1>'+(quiz.description?'<p class="cover-desc">'+esc(quiz.description)+'</p>':'')+'<div class="cover-meta"><span class="cover-badge">◷ Disponível até '+esc(dateFmt(invitation.expires_at))+'</span><span class="cover-badge">📋 '+total+' pergunta'+(total===1?'':'s')+'</span></div><div class="cover-start-wrap"><button class="btn-start" id="btn-cover-start">Começar questionário <span aria-hidden="true">→</span></button><span class="cover-count">Responda com calma, uma pergunta por vez.</span></div></div></div>';
    }
    function slideContext(step,si){
      const b=step.data;const title=usable(b?.title);const rawBody=usable(b?.bodyHtml)||usable(b?.body);
      const bodyHtml=rawBody?sanitize(usable(b?.bodyHtml)||'<p>'+esc(rawBody).replace(/\r?\n/g,'<br>')+'</p>'):'';const img=safeUrl(b?.image);
      return '<div class="slide-inner"><div class="context-block"><div class="context-block-header"><div class="context-block-icon">▣</div><div><p class="context-block-eyebrow">Informação</p>'+(title?'<h2 class="context-block-title">'+esc(title)+'</h2>':'')+'</div></div>'+(bodyHtml?'<div class="context-block-body">'+bodyHtml+'</div>':'')+(img?'<img class="context-block-image" src="'+esc(img)+'" alt="Imagem de apoio" onerror="this.remove()" />':'')+'</div><div class="quiz-nav">'+(si>0?'<button class="btn-nav btn-prev" data-action="prev">← Anterior</button>':'<span></span>')+'<button class="btn-nav btn-next" data-action="next">Continuar <span aria-hidden="true">→</span></button></div></div>';
    }
    function slideQuestion(step,si){
      const q=step.data,idx=step.index;const img=safeUrl(q.questionImage);const title=usable(q.title)||usable(q.questionText)||'Pergunta';
      const qSteps=state.steps.filter(s=>s.type==='question');const qPos=qSteps.indexOf(step)+1;
      const isLast=state.steps[si+1]?.type==='review';
      const imgMk=img?'<img class="question-image" src="'+esc(img)+'" alt="Imagem de apoio" onerror="this.remove()" />'  :'';
      return '<div class="slide-inner"><article class="question-card" data-card="'+esc(q.id)+'"><div class="question-top"><div class="question-icon">'+esc(q.icon||'○')+'</div><div><p class="question-code">Pergunta '+qPos+'</p><h2 class="question-title">'+esc(title)+(q.required!==false?'<span class="required">*</span>':'')+'</h2></div></div><div class="rich-text">'+qText(q)+'</div>'+imgMk+'<div class="answer-area">'+renderAnswer(q,idx)+'</div><p class="q-error">Responda esta pergunta para continuar.</p></article><div class="quiz-nav">'+(si>0?'<button class="btn-nav btn-prev" data-action="prev">← Anterior</button>':'<span></span>')+'<button class="btn-nav btn-next" data-action="next">'+(isLast?'Revisar respostas':'Próxima')+' <span aria-hidden="true">→</span></button></div></div>';
    }
    function slideReview(step,si){
      const{quiz,snapshots}=step.data;
      const items=snapshots.map(q=>{const val=curVal(q);const lbl=val?.label||'';return '<div class="review-item"><p class="review-item-q">'+esc(q.title||q.questionText||'Pergunta')+'</p>'+(lbl?'<p class="review-item-a">'+esc(lbl)+'</p>':'<p class="review-item-empty">Não respondida</p>')+'</div>';}).join('');
      return '<div class="slide-inner"><div class="review-card"><h2>Revisão das respostas</h2><p>Verifique suas respostas antes de enviar. Você pode voltar para alterar qualquer uma.</p><div class="review-list" id="review-list">'+items+'</div><div class="review-footer"><p>Ao enviar, suas respostas serão encaminhadas de forma segura para a Dra. Jessica.</p><button class="btn-submit" id="btn-final-submit">Enviar respostas ✓</button></div></div><div class="quiz-nav" style="margin-top:12px"><button class="btn-nav btn-prev" data-action="prev">← Voltar</button></div></div>';
    }
    function buildSlide(step,si){
      let inner='';
      if(step.type==='cover')inner=slideCover(step,si);
      else if(step.type==='context')inner=slideContext(step,si);
      else if(step.type==='question')inner=slideQuestion(step,si);
      else if(step.type==='review')inner=slideReview(step,si);
      return '<div class="quiz-slide'+(si===0?' active':'')+'" id="slide-'+si+'" data-step="'+si+'">'+inner+'</div>';
    }
    function refreshReview(){
      const el=document.getElementById('review-list');if(!el)return;
      const snaps=state.invitation?.quiz?.questionSnapshots||[];
      el.innerHTML=snaps.map(q=>{const val=curVal(q);const lbl=val?.label||'';return '<div class="review-item"><p class="review-item-q">'+esc(q.title||q.questionText||'Pergunta')+'</p>'+(lbl?'<p class="review-item-a">'+esc(lbl)+'</p>':'<p class="review-item-empty">Não respondida</p>')+'</div>';}).join('');
    }

    function fileToDataUrl(file){return new Promise((res,rej)=>{if(!file.type.startsWith('image/')||file.size>2*1024*1024)return rej(new Error('Escolha uma imagem válida de até 2 MB.'));const r=new FileReader();r.onerror=()=>rej(new Error('Não foi possível ler a imagem.'));r.onload=()=>res({name:file.name,type:file.type,dataUrl:r.result});r.readAsDataURL(file);});}
    function showState(kind,title,text,summary=null){
      document.getElementById('quiz-wrap').classList.remove('active');
      const appState=document.getElementById('app-state');appState.style.display='flex';
      const hasScore=kind==='success'&&Number.isFinite(Number(summary?.scorePercent));
      const band=hasScore?{label:summary.scoreLabel||scoreBand(summary.scorePercent).label,emoji:summary.scoreEmoji||scoreBand(summary.scorePercent).emoji}:null;
      const scoreMk=hasScore?'<div class="result-score"><span class="result-emoji">'+esc(band.emoji)+'</span><span><small>Sua pontuação</small><strong>'+Number(summary.scorePercent).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%</strong><span>'+esc(band.label)+'</span></span></div>':'';
      appState.innerHTML='<section class="state-card '+kind+'"><div class="state-symbol">'+(kind==='success'?'✓':kind==='error'?'!':'•')+'</div><h1>'+esc(title)+'</h1><p>'+esc(text)+'</p>'+scoreMk+'</section>';
    }
    async function submitQuiz(){
      state.submitted=true;clearTimeout(state.progressTimer);
      const quiz=state.invitation?.quiz||{},qs=quiz.questionSnapshots||[];
      const btn=document.getElementById('btn-final-submit');if(btn){btn.disabled=true;btn.textContent='Enviando respostas…';}
      let valid=true;const answers=[];
      for(const q of qs){
        const cur=curVal(q);if(q.required!==false&&!cur){valid=false;continue;}if(!cur)continue;
        let value=cur.value;
        if(cur.file){try{value=await fileToDataUrl(cur.file);}catch(e){valid=false;continue;}}
        const sc=['single','linear','emoji'].includes(q.type);const cfg=scoreCfg(quiz,q);const inc=sc&&cfg.active;
        const raw=inc?(Number(cur.score||0)||0):0;const w=inc?cfg.weight:null;
        answers.push({questionId:q.id,questionCode:q.code||'',questionTitle:q.title||q.questionText||'',type:q.type||'single',value,label:cur.label||'',evaluationLabel:cur.label||'',evaluationEmoji:cur.evaluationEmoji||'',clarificationPrompt:clarPrompt(q,cur.value),clarificationResponse:readClarResp(q,cur.value),score:inc?raw*w:0,rawScore:raw,weight:w,scored:inc});
      }
      if(!valid){if(btn){btn.disabled=false;btn.textContent='Enviar respostas ✓';}state.submitted=false;alert('Algumas perguntas obrigatórias não foram respondidas. Volte e complete as respostas.');return;}
      const scores=answers.map(a=>Number(a.score||0)).filter(Number.isFinite);
      const summary={totalQuestions:qs.length,answeredQuestions:answers.length,scoredQuestions:answers.filter(a=>a.scored).length,totalScore:scores.reduce((t,s)=>t+s,0),submittedAt:new Date().toISOString()};
      try{
        const result=await req('submit',{token,answers,responseSummary:summary});
        if(result.success)showState('success','Respostas enviadas com sucesso!','Obrigada por responder. A Dra. Jessica receberá suas informações para acompanhar sua evolução.',result.summary||summary);
        else if(result.reason==='expired')showState('error','Este convite expirou','Peça à Dra. Jessica um novo convite para responder o questionário.');
        else if(result.reason==='already_answered')showState('error','Questionário já respondido','Este convite foi usado anteriormente. Caso precise alterar alguma resposta, entre em contato com a Dra. Jessica.');
        else throw new Error('Não foi possível enviar suas respostas.');
      }catch(e){if(btn){btn.disabled=false;btn.textContent='Enviar respostas ✓';}state.submitted=false;alert(e.message||'Não foi possível enviar suas respostas. Tente novamente.');}
    }

    function bindEvents(stage){
      stage.addEventListener('click',e=>{
        const btn=e.target.closest('[data-action]');
        if(btn?.dataset.action==='next')goNext();
        if(btn?.dataset.action==='prev')goPrev();
        if(e.target.id==='btn-cover-start')goNext();
        if(e.target.id==='btn-final-submit')submitQuiz();
      });
      stage.addEventListener('change',e=>{updateClarifications();trackProgress();const c=e.target.closest('.question-card');if(c)c.classList.remove('is-invalid');});
      stage.addEventListener('input',e=>{updateClarifications();trackProgress();const c=e.target.closest('.question-card');if(c)c.classList.remove('is-invalid');});
    }

    function renderQuiz(invitation){
      const quiz=invitation.quiz||{};const snaps=Array.isArray(quiz.questionSnapshots)?quiz.questionSnapshots:[];
      const qs=snaps.map(q=>({...q,required:scoreCfg(quiz,q).required}));quiz.questionSnapshots=qs;
      state.invitation=invitation;state.steps=buildSteps(invitation);
      const revStep=state.steps.find(s=>s.type==='review');if(revStep)revStep.data.snapshots=qs;
      state.currentStep=0;
      const stage=document.getElementById('quiz-stage');stage.innerHTML=state.steps.map((s,i)=>buildSlide(s,i)).join('');
      bindEvents(stage);document.getElementById('app-state').style.display='none';document.getElementById('quiz-wrap').classList.add('active');renderHeader();
    }

    async function boot(){
      if(!token)return showState('error','Convite inválido','Este link não contém um convite válido. Verifique o e-mail recebido ou entre em contato com a Dra. Jessica.');
      try{
        try{await req('click',{token},{keepalive:true});}catch{}
        const inv=await req('get',{token});
        if(inv.state==='ready')return renderQuiz(inv);
        if(inv.state==='expired')return showState('error','Convite expirado','O prazo para responder este questionário terminou. Solicite um novo convite à Dra. Jessica.');
        if(inv.state==='answered')return showState('success','Questionário já respondido','Este convite já foi utilizado. Obrigada pela sua resposta.',inv.summary||null);
        return showState('error','Convite indisponível','Este convite não está disponível. Solicite um novo link à Dra. Jessica.');
      }catch{showState('error','Não foi possível abrir o questionário','Tente novamente em alguns instantes. Se o problema persistir, entre em contato com a Dra. Jessica.');}
    }
    boot();
  </script>
</body>
