<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Responder questionário | Jessica Melo Nutricionista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#a88b36; --gold-soft:#f5e6c8; --ink:#3d3226; --muted:#766c5f; --line:#e8dfd0; --surface:#fff; --background:#faf8f3; --danger:#b23b3b; --success:#267a55; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--background); color:var(--ink); font-family:Poppins,Arial,sans-serif; }
    .shell { width:min(760px,calc(100% - 32px)); margin:0 auto; padding:32px 0 52px; }
    .brand { display:flex; align-items:center; gap:10px; color:var(--gold); font-size:13px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; }
    .brand span { display:grid; place-items:center; width:28px; height:28px; border-radius:9px; background:var(--gold); color:#fff; font-size:16px; }
    .hero, .question-card, .context-block, .state-card { background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:0 10px 30px rgba(61,50,38,.055); }
    .hero { padding:28px; margin:18px 0; overflow:hidden; position:relative; }
    .hero:after { content:""; position:absolute; width:230px; height:230px; border-radius:50%; right:-115px; top:-155px; background:var(--gold-soft); opacity:.7; }
    .eyebrow { position:relative; z-index:1; margin:0 0 8px; color:var(--gold); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    h1 { position:relative; z-index:1; margin:0; max-width:580px; color:var(--ink); font-size:clamp(25px,5vw,34px); line-height:1.2; }
    .hero p { position:relative; z-index:1; max-width:590px; margin:13px 0 0; color:var(--muted); font-size:14px; line-height:1.7; }
    .deadline { display:inline-flex; position:relative; z-index:1; align-items:center; gap:7px; margin-top:18px; padding:8px 11px; border-radius:999px; background:#fdf7ea; color:#715b25; font-size:12px; font-weight:600; }
    .progress { height:6px; overflow:hidden; margin:22px 0 16px; border-radius:999px; background:#ede6dc; }
    .progress > div { height:100%; width:0; border-radius:inherit; background:var(--gold); transition:width .2s ease; }
    .progress-label { margin:0 0 16px; color:var(--muted); font-size:12px; font-weight:600; }
    .question-card { padding:24px; margin:16px 0; }.context-block { margin:16px 0; overflow:hidden; }.context-block-header { display:flex; align-items:flex-start; gap:12px; padding:19px 20px 0; }.context-block-icon { display:grid; flex:0 0 auto; place-items:center; width:36px; height:36px; border-radius:12px; background:#fbf5e7; color:var(--gold); font-size:18px; }.context-block-eyebrow { margin:2px 0 4px; color:var(--gold); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }.context-block-title { margin:0; color:var(--ink); font-size:17px; line-height:1.4; }.context-block-body { padding:14px 20px 20px; color:#4e4438; font-size:14px; line-height:1.65; }.context-block-body p { margin:0 0 8px; }.context-block-image { display:block; width:calc(100% - 40px); max-height:320px; margin:0 20px 20px; border:1px solid var(--line); border-radius:13px; object-fit:cover; }
    .question-top { display:flex; align-items:flex-start; gap:12px; }
    .question-icon { display:grid; flex:0 0 auto; place-items:center; width:36px; height:36px; border-radius:12px; background:#fbf5e7; color:var(--gold); font-size:20px; }
    .question-code { margin:2px 0 5px; color:var(--gold); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .question-title { margin:0; color:var(--ink); font-size:17px; line-height:1.45; }
    .required { margin-left:4px; color:var(--danger); }
    .rich-text { margin:13px 0 0 48px; color:#4e4438; font-size:14px; line-height:1.65; }
    .rich-text p { margin:0 0 8px; }.rich-text strong { font-weight:700; }.rich-text em { font-style:italic; }.rich-text u { text-decoration:underline; }
    .question-image { display:block; max-width:calc(100% - 48px); max-height:280px; margin:16px 0 0 48px; border-radius:12px; border:1px solid var(--line); object-fit:cover; }
    .answer-area { margin:22px 0 0 48px; }
    .choice { display:flex; align-items:flex-start; gap:11px; width:100%; margin:9px 0; padding:13px 14px; border:1px solid var(--line); border-radius:12px; cursor:pointer; transition:border-color .16s,background .16s,transform .16s; }
    .choice:hover { border-color:#c6ad6d; background:#fffdf8; }.choice:has(input:checked) { border-color:var(--gold); background:#fffaf0; }.choice input { margin:3px 0 0; accent-color:var(--gold); }.choice span { color:#4e4438; font-size:14px; line-height:1.45; }
    textarea, input[type="number"], input[type="text"] { width:100%; min-height:48px; padding:13px 14px; border:1px solid var(--line); border-radius:12px; outline:none; color:var(--ink); font:inherit; font-size:14px; background:#fff; transition:border-color .16s,box-shadow .16s; }
    textarea { min-height:120px; resize:vertical; } textarea:focus, input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(168,139,54,.14); }
    .unit { margin:8px 0 0; color:var(--muted); font-size:12px; }
    .linear-scale { display:grid; grid-template-columns:repeat(var(--scale-count),minmax(34px,1fr)); gap:7px; margin-top:12px; }.linear-scale label { display:grid; place-items:center; min-height:42px; border:1px solid var(--line); border-radius:10px; cursor:pointer; font-size:14px; font-weight:600; }.linear-scale label:has(input:checked) { color:#fff; background:var(--gold); border-color:var(--gold); }.linear-scale input { position:absolute; opacity:0; pointer-events:none; }.scale-labels { display:flex; justify-content:space-between; gap:18px; margin-top:8px; color:var(--muted); font-size:11px; }
    .emoji-scale { display:flex; flex-wrap:wrap; gap:9px; }.emoji-scale label { display:grid; place-items:center; width:48px; height:48px; border:1px solid var(--line); border-radius:12px; cursor:pointer; font-size:25px; transition:transform .16s,border-color .16s,background .16s; }.emoji-scale label:hover { transform:translateY(-2px); }.emoji-scale label:has(input:checked) { border-color:var(--gold); background:#fff6dd; }.emoji-scale input { position:absolute; opacity:0; pointer-events:none; }
    .file-input { width:100%; padding:12px; border:1px dashed #cbbd9c; border-radius:12px; background:#fffcf5; color:#5f533f; font:inherit; font-size:13px; }.file-note { margin:8px 0 0; color:var(--muted); font-size:11px; }
    .error { display:none; margin:10px 0 0 48px; color:var(--danger); font-size:12px; font-weight:600; }.question-card.is-invalid { border-color:#d98989; }.question-card.is-invalid .error { display:block; }
    .submit-row { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; margin-top:24px; padding:18px 0; }.submit-row p { margin:0; max-width:390px; color:var(--muted); font-size:11px; line-height:1.55; }.submit { min-height:49px; border:0; border-radius:12px; padding:0 20px; background:var(--gold); color:#fff; cursor:pointer; font:inherit; font-size:14px; font-weight:700; box-shadow:0 8px 16px rgba(168,139,54,.22); transition:transform .16s,opacity .16s; }.submit:hover { transform:translateY(-1px); }.submit:disabled { cursor:not-allowed; opacity:.6; transform:none; }
    .state-card { margin-top:54px; padding:42px 28px; text-align:center; }.state-symbol { display:grid; place-items:center; width:56px; height:56px; margin:0 auto 16px; border-radius:18px; background:#f8ecd1; color:var(--gold); font-size:25px; }.state-card h1 { margin:0 auto; font-size:26px; }.state-card p { max-width:470px; margin:12px auto 0; color:var(--muted); font-size:14px; line-height:1.7; }.state-card.success .state-symbol { background:#dff4e8; color:var(--success); }.state-card.error .state-symbol { background:#fbe4e4; color:var(--danger); }
    .hidden { display:none!important; }
    @media (max-width:600px) { .shell { width:min(100% - 24px,760px); padding-top:20px; }.hero,.question-card { border-radius:16px; padding:20px; }.rich-text,.answer-area,.error { margin-left:0; }.question-image { max-width:100%; margin-left:0; }.submit-row { align-items:stretch; }.submit { width:100%; }.linear-scale { gap:5px; }.linear-scale label { min-height:38px; } }
  </style>
</head>
<body>
  <main class="shell" id="app" aria-live="polite"><div class="state-card"><div class="state-symbol">…</div><h1>Preparando seu questionário</h1><p>Estamos carregando o convite de forma segura.</p></div></main>
  <script>
    const endpoint = '/api/questionnaire-email';
    const token = new URLSearchParams(location.search).get('token') || '';
    const state = { invitation:null, answers:{} };
    const app = document.getElementById('app');

    function escapeHtml(value='') { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function usableText(value='') { const text = String(value ?? '').trim(); return text && !/^(undefined|null)$/i.test(text) ? text : ''; }
    function safeUrl(value='') { const raw = usableText(value); if (!raw) return ''; if (/^data:/i.test(raw)) return /^data:image\/(png|jpe?g|webp);base64,/i.test(raw) ? raw : ''; try { const url = new URL(raw, location.origin); return ['https:','http:'].includes(url.protocol) ? url.href : ''; } catch { return ''; } }
    function sanitizeRichHtml(value='') { const template = document.createElement('template'); template.innerHTML = usableText(value); const permitted = new Set(['P','DIV','BR','STRONG','B','EM','I','U','UL','OL','LI','SPAN']); const validColor = color => /^((#[0-9a-f]{3,8})|(rgb|hsl)a?\([^)]{1,80}\))$/i.test(String(color || '').trim()); const walker = document.createTreeWalker(template.content, NodeFilter.SHOW_ELEMENT); const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode); nodes.forEach(node => { if (!permitted.has(node.tagName)) { node.replaceWith(...node.childNodes); return; } const color = node.tagName === 'SPAN' ? node.style.color : ''; [...node.attributes].forEach(attribute => node.removeAttribute(attribute.name)); if (node.tagName === 'SPAN' && validColor(color)) node.style.color = color; }); return template.innerHTML; }
    function dateText(value) { try { return new Intl.DateTimeFormat('pt-BR',{dateStyle:'long',timeZone:'America/Sao_Paulo'}).format(new Date(value)); } catch { return ''; } }
    function showState(kind, title, text) { app.innerHTML = `<section class="state-card ${kind}"><div class="state-symbol">${kind === 'success' ? '✓' : kind === 'error' ? '!' : '•'}</div><h1>${escapeHtml(title)}</h1><p>${escapeHtml(text)}</p></section>`; }
    async function request(action, body={}) { const response = await fetch(endpoint, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action, ...body}) }); const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.message || 'Não foi possível processar sua solicitação.'); return data; }
    function getQuestionText(question) { const html = usableText(question.questionHtml); const text = usableText(question.questionText) || usableText(question.title); if (!html) return `<p>${escapeHtml(text)}</p>`; if (!/<\/?[a-z][^>]*>/i.test(html)) return `<p>${escapeHtml(html).replace(/\r?\n/g, '<br>')}</p>`; return sanitizeRichHtml(html); }
    function getOptions(question) { return Array.isArray(question.options) ? question.options.filter(Boolean) : []; }
    function optionScore(question, option) { const found = Array.isArray(question.optionSettings) ? question.optionSettings.find(item => String(item?.text ?? item?.option ?? item?.label ?? item?.emoji ?? item?.value ?? '') === String(option)) : null; return Number(found?.score ?? 0) || 0; }
    function questionScoreConfig(quiz, questionId) { const config = quiz?.questionSettings?.[questionId] || {}; const weight = Math.round(Number(config.weight)); return { active:config.active !== false, weight:Number.isFinite(weight) && weight >= 1 && weight <= 5 ? weight : 1 }; }
    function scaleValues(question) { const config = question.scaleConfig || {}; const minimum = Number.isFinite(Number(config.min)) ? Number(config.min) : 0; const maximum = Number.isFinite(Number(config.max)) ? Number(config.max) : 10; return Array.from({length:Math.max(2,Math.min(11,maximum-minimum+1))},(_,i)=>minimum+i); }
    function renderAnswer(question, index) { const name = `answer-${index}`; const options = getOptions(question); const type = question.type || 'single';
      if (type === 'open') return `<textarea data-question="${escapeHtml(question.id)}" aria-label="Resposta" placeholder="Escreva sua resposta"></textarea>`;
      if (type === 'metric' || type === 'number') return `<input data-question="${escapeHtml(question.id)}" type="number" inputmode="decimal" step="any" aria-label="Resposta numérica" placeholder="Digite um número" /><p class="unit">${question.metricUnit ? `Unidade: ${escapeHtml(question.metricUnit)}` : 'Informe somente números.'}</p>`;
      if (type === 'photo') return `<input data-question="${escapeHtml(question.id)}" class="file-input" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Enviar foto" /><p class="file-note">Envie uma imagem em JPG, PNG ou WebP de até 2 MB.</p>`;
      if (type === 'linear') { const config = question.scaleConfig || {}; const values = scaleValues(question); return `<div class="linear-scale" style="--scale-count:${values.length}">${values.map(value=>`<label><input type="radio" name="${name}" value="${value}" data-question="${escapeHtml(question.id)}" data-label="${value}" />${value}</label>`).join('')}</div><div class="scale-labels"><span>${escapeHtml(config.minLabel || 'Menor')}</span><span>${escapeHtml(config.maxLabel || 'Maior')}</span></div>`; }
      if (type === 'emoji') { const emojis = options.length ? options : ['😞','🙁','😐','🙂','😄']; return `<div class="emoji-scale">${emojis.map((emoji,i)=>`<label title="${escapeHtml(emoji)}"><input type="radio" name="${name}" value="${escapeHtml(emoji)}" data-question="${escapeHtml(question.id)}" data-label="${escapeHtml(emoji)}" data-score="${optionScore(question,emoji)}" />${escapeHtml(emoji)}</label>`).join('')}</div>`; }
      return `<div>${options.map(option=>`<label class="choice"><input type="radio" name="${name}" value="${escapeHtml(option)}" data-question="${escapeHtml(question.id)}" data-label="${escapeHtml(option)}" data-score="${optionScore(question,option)}" /><span>${escapeHtml(option)}</span></label>`).join('')}</div>`;
    }
    function renderQuestion(question, index) { const image = safeUrl(question.questionImage); const title = usableText(question.title) || usableText(question.questionText) || 'Pergunta'; const imageMarkup = image ? `<img class="question-image" src="${escapeHtml(image)}" alt="Imagem de apoio da pergunta" onerror="this.remove()" />` : ''; return `<article class="question-card" data-card="${escapeHtml(question.id)}"><div class="question-top"><div class="question-icon">${escapeHtml(question.icon || '○')}</div><div><p class="question-code">Pergunta ${index + 1}${question.code ? ` · ${escapeHtml(question.code)}` : ''}</p><h2 class="question-title">${escapeHtml(title)}${question.required !== false ? '<span class="required">*</span>' : ''}</h2></div></div><div class="rich-text">${getQuestionText(question)}</div>${imageMarkup}<div class="answer-area">${renderAnswer(question,index)}</div><p class="error">Responda esta pergunta para continuar.</p></article>`; }
    function renderContextBlock(block) { const title = usableText(block?.title); const rawBody = usableText(block?.bodyHtml) || usableText(block?.body); const bodyHtml = rawBody ? sanitizeRichHtml(usableText(block?.bodyHtml) || `<p>${escapeHtml(rawBody).replace(/\r?\n/g, '<br>')}</p>`) : ''; const image = safeUrl(block?.image); if (!title && !bodyHtml && !image) return ''; return `<aside class="context-block"><div class="context-block-header"><div class="context-block-icon">▣</div><div><p class="context-block-eyebrow">Bloco contextual</p>${title ? `<h2 class="context-block-title">${escapeHtml(title)}</h2>` : ''}</div></div>${bodyHtml ? `<div class="context-block-body">${bodyHtml}</div>` : ''}${image ? `<img class="context-block-image" src="${escapeHtml(image)}" alt="Imagem de apoio do bloco contextual" onerror="this.remove()" />` : ''}</aside>`; }
    function renderQuiz(invitation) { const quiz = invitation.quiz || {}; const questions = Array.isArray(quiz.questionSnapshots) ? quiz.questionSnapshots : []; const contextBlocks = Array.isArray(quiz.contextBlocks) ? quiz.contextBlocks : []; state.invitation = invitation; app.innerHTML = `<div class="brand"><span>✦</span> Jessica Melo Nutricionista</div><section class="hero"><p class="eyebrow">Acompanhamento nutricional</p><h1>${escapeHtml(quiz.title || invitation.quiz_title || 'Questionário')}</h1>${quiz.description ? `<p>${escapeHtml(quiz.description)}</p>` : ''}<span class="deadline">◷ Disponível até ${escapeHtml(dateText(invitation.expires_at))}</span></section>${contextBlocks.map(renderContextBlock).join('')}<div class="progress"><div id="progress-bar"></div></div><p class="progress-label" id="progress-label">0 de ${questions.length} perguntas respondidas</p><form id="quiz-form" novalidate>${questions.map(renderQuestion).join('')}<div class="submit-row"><p>Ao enviar, suas respostas serão encaminhadas de forma segura para o acompanhamento da Dra. Jessica.</p><button class="submit" type="submit">Enviar respostas</button></div></form>`; document.getElementById('quiz-form').addEventListener('input', updateProgress); document.getElementById('quiz-form').addEventListener('change', updateProgress); document.getElementById('quiz-form').addEventListener('submit', submitQuiz); updateProgress(); }
    function currentValue(question) { const input = document.querySelector(`[data-question="${CSS.escape(question.id)}"]`); if (!input) return null; if (question.type === 'single' || question.type === 'linear' || question.type === 'emoji') { const selected = document.querySelector(`[data-question="${CSS.escape(question.id)}"]:checked`); return selected ? { value:selected.value, label:selected.dataset.label || selected.value, score:Number(selected.dataset.score || 0) || 0 } : null; } if (question.type === 'photo') { const file = input.files?.[0]; return file ? { file } : null; } const value = String(input.value || '').trim(); return value ? { value, label:value, score:0 } : null; }
    function updateProgress() { const questions = state.invitation?.quiz?.questionSnapshots || []; const answered = questions.filter(question => currentValue(question)).length; const pct = questions.length ? (answered / questions.length) * 100 : 0; const label = document.getElementById('progress-label'); const bar = document.getElementById('progress-bar'); if (label) label.textContent = `${answered} de ${questions.length} perguntas respondidas`; if (bar) bar.style.width = `${pct}%`; }
    function fileToDataUrl(file) { return new Promise((resolve,reject) => { if (!file.type.startsWith('image/') || file.size > 2 * 1024 * 1024) return reject(new Error('Escolha uma imagem válida de até 2 MB.')); const reader = new FileReader(); reader.onerror = () => reject(new Error('Não foi possível ler a imagem.')); reader.onload = () => resolve({name:file.name,type:file.type,dataUrl:reader.result}); reader.readAsDataURL(file); }); }
    async function submitQuiz(event) { event.preventDefault(); const quiz = state.invitation?.quiz || {}; const questions = quiz.questionSnapshots || []; const form = event.currentTarget; let valid = true; const answers = []; for (const question of questions) { const card = document.querySelector(`[data-card="${CSS.escape(question.id)}"]`); const current = currentValue(question); card?.classList.remove('is-invalid'); if (question.required !== false && !current) { valid = false; card?.classList.add('is-invalid'); continue; } if (!current) continue; let value = current.value; if (current.file) { try { value = await fileToDataUrl(current.file); } catch (error) { valid = false; card?.classList.add('is-invalid'); card.querySelector('.error').textContent = error.message; continue; } } const scoreable = ['single','linear','emoji'].includes(question.type); const scoreConfig = questionScoreConfig(quiz, question.id); const includeInScore = scoreable && scoreConfig.active; const rawScore = includeInScore ? (Number(current.score || 0) || 0) : 0; const weight = includeInScore ? scoreConfig.weight : null; answers.push({ questionId:question.id, questionCode:question.code || '', questionTitle:question.title || question.questionText || '', type:question.type || 'single', value, label:current.label || '', score:includeInScore ? rawScore * weight : 0, rawScore, weight, scored:includeInScore }); }
      if (!valid) { document.querySelector('.question-card.is-invalid')?.scrollIntoView({behavior:'smooth',block:'center'}); return; }
      const button = form.querySelector('button[type="submit"]'); button.disabled = true; button.textContent = 'Enviando respostas...'; const scores = answers.map(item=>Number(item.score || 0)).filter(Number.isFinite); const responseSummary = { totalQuestions:questions.length, answeredQuestions:answers.length, totalScore:scores.reduce((total,score)=>total+score,0), submittedAt:new Date().toISOString() };
      try { const result = await request('submit',{ token, answers, responseSummary }); if (result.success) { showState('success','Respostas enviadas com sucesso','Obrigada por responder. A Dra. Jessica receberá suas informações para acompanhar sua evolução.'); } else if (result.reason === 'expired') { showState('error','Este convite expirou','Peça à Dra. Jessica um novo convite para responder o questionário.'); } else if (result.reason === 'already_answered') { showState('error','Questionário já respondido','Este convite foi usado anteriormente. Caso precise alterar alguma resposta, entre em contato com a Dra. Jessica.'); } else { throw new Error('Não foi possível enviar suas respostas.'); } } catch (error) { button.disabled = false; button.textContent = 'Enviar respostas'; alert(error.message || 'Não foi possível enviar suas respostas. Tente novamente.'); } }
    async function boot() { if (!token) return showState('error','Convite inválido','Este link não contém um convite válido. Verifique o e-mail recebido ou entre em contato com a Dra. Jessica.'); try { const invitation = await request('get',{token}); if (invitation.state === 'ready') return renderQuiz(invitation); if (invitation.state === 'expired') return showState('error','Convite expirado','O prazo para responder este questionário terminou. Solicite um novo convite à Dra. Jessica.'); if (invitation.state === 'answered') return showState('success','Questionário já respondido','Este convite já foi utilizado. Obrigada pela sua resposta.'); return showState('error','Convite indisponível','Este convite não está disponível. Solicite um novo link à Dra. Jessica.'); } catch { showState('error','Não foi possível abrir o questionário','Tente novamente em alguns instantes. Se o problema persistir, entre em contato com a Dra. Jessica.'); } }
    boot();
  </script>
</body>
</html>
