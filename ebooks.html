<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eBooks educativos - Jessica Melo Nutri</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="icon" type="image/jpeg" href="/assets/images/Jessica-site2.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>tailwind.config={theme:{extend:{colors:{primary:'#f47a3c',orange:'#ff8b47',dark:'#17181d',panel:'#22242b',muted:'#a9abb3'}}}};</script>
  <style>body{font-family:Poppins,sans-serif;transition:background .2s,color .2s}body[data-patient-theme=traditional]{background:#faf8f3;color:#3d3226}body[data-patient-theme=traditional] header{background:rgba(255,255,255,.9);border-color:rgba(61,50,38,.12)}body[data-patient-theme=traditional] main{background:#faf8f3;color:#3d3226}body[data-patient-theme=traditional] aside{background:#fff;border-color:rgba(61,50,38,.12)}body[data-patient-theme=traditional] .bg-panel{background:#fff;border-color:rgba(61,50,38,.12)}body[data-patient-theme=traditional] .text-white{color:#3d3226}body[data-patient-theme=traditional] .text-gray-300,body[data-patient-theme=traditional] .text-gray-400{color:#6b6257}.scrollbar::-webkit-scrollbar{width:7px}.scrollbar::-webkit-scrollbar-thumb{background:#4b4d56;border-radius:999px}</style>
</head>
<body class="bg-dark text-white min-h-screen">
  <header class="h-16 bg-[#1d1e24] border-b border-white/5 flex items-center justify-between px-4 sm:px-7 sticky top-0 z-40"><div class="flex items-center gap-5"><button id="mobile-sidebar-btn" class="lg:hidden text-white text-2xl">☰</button><a href="/paciente.html" class="block"><img data-patient-logo src="/assets/images/Logomarca_nobg_branco.png" class="w-32 sm:w-40 h-auto max-h-10 object-contain" alt="Jessica Melo Nutricionista"></a><span class="hidden sm:inline text-xs text-muted border-l border-white/10 pl-5">Área do paciente</span></div><div class="flex items-center gap-2 sm:gap-4"><a href="/paciente.html" class="bg-white/10 hover:bg-orange hover:text-dark px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all">Menu principal</a><button data-theme-toggle type="button" class="bg-white/10 hover:bg-orange hover:text-dark w-9 h-9 p-0 rounded-full inline-flex items-center justify-center transition-all" aria-label="Alternar tema"></button><button id="logout-btn" class="bg-white/10 hover:bg-white/20 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all">Sair</button></div></header>
  <div class="flex min-h-[calc(100vh-4rem)]"><aside id="sidebar" class="fixed lg:sticky top-16 left-0 z-30 w-72 h-[calc(100vh-4rem)] bg-[#202126] border-r border-white/5 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 overflow-y-auto scrollbar"><div class="p-5"><p class="text-xs font-bold text-muted uppercase tracking-widest mb-6">Trilhas</p><nav id="theme-nav" class="space-y-1"></nav></div></aside><main class="flex-1 min-w-0 bg-[#17181d]"><div class="px-4 sm:px-8 lg:px-10 py-7 sm:py-10 max-w-[1600px] mx-auto"><div class="flex items-end justify-between gap-4 mb-7"><div><p class="text-xs uppercase tracking-[0.2em] text-orange font-bold mb-2">Biblioteca de saúde</p><h1 class="text-2xl sm:text-3xl font-bold">eBooks educativos</h1><p class="text-sm text-muted mt-2">Escolha um tema para acessar os materiais preparados para você.</p></div><span id="ebook-count" class="hidden sm:inline text-xs text-muted"></span></div><div id="ebooks-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-5"></div><div id="no-ebooks" class="hidden border border-white/10 bg-panel rounded-2xl p-10 text-center text-muted">Nenhum eBook publicado no momento.</div></div></main></div>
  <div id="ebook-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-4"><div class="w-full max-w-4xl bg-panel rounded-2xl overflow-hidden shadow-2xl"><div class="flex items-center justify-between px-5 py-4 border-b border-white/10"><div><p id="modal-theme" class="text-xs text-orange uppercase font-bold"></p><h2 id="modal-title" class="font-bold"></h2></div><button id="close-ebook" class="text-2xl text-muted hover:text-white">×</button></div><div class="aspect-[4/3] bg-black"><iframe id="ebook-frame" class="w-full h-full" title="Material educativo" allow="autoplay"></iframe></div></div></div>
  <script type="module">import{db,applyPatientTheme,togglePatientTheme}from'/assets/js/db.js';(async()=>{applyPatientTheme();document.querySelectorAll('[data-theme-toggle]').forEach(b=>b.addEventListener('click',togglePatientTheme));const s=await db.ready();if(!s||s.role!=='patient'){window.location.href=s&&s.role==='admin'?'/admin.html':'/login.html';return}const books=await db.getPublishedEbooks(),groups=books.reduce((g,b)=>{const t=b.theme||'Geral';(g[t] ||= []).push(b);return g},{}),themes=Object.keys(groups).sort((a,b)=>a.localeCompare(b,'pt-BR')),nav=document.getElementById('theme-nav'),grid=document.getElementById('ebooks-grid'),modal=document.getElementById('ebook-modal'),frame=document.getElementById('ebook-frame');document.getElementById('ebook-count').textContent=`${books.length} material${books.length===1?'':'is'}`;document.getElementById('no-ebooks').classList.toggle('hidden',books.length>0);const close=()=>{modal.classList.add('hidden');modal.classList.remove('flex');frame.src=''};document.getElementById('close-ebook').addEventListener('click',close);modal.addEventListener('click',e=>{if(e.target===modal)close()});document.getElementById('logout-btn').addEventListener('click',async()=>{await db.logout();location.href='/login.html'});document.getElementById('mobile-sidebar-btn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('-translate-x-full'));function render(t){grid.innerHTML='';groups[t].forEach(book=>{const card=document.createElement('article');card.className='group bg-panel rounded-xl overflow-hidden border border-white/5 hover:border-orange/50 transition-all cursor-pointer';const thumb=book.thumbnailUrl||book.thumbnail_url||'';card.innerHTML=`<div class="relative aspect-[4/3] bg-[#30323a] overflow-hidden">${thumb?`<img src="${thumb}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.style.display='none'" />`:'<div class="w-full h-full flex items-center justify-center text-orange text-5xl">▤</div>'}<div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent"></div><span class="absolute inset-0 flex items-center justify-center"><span class="w-12 h-12 rounded-full bg-orange text-dark flex items-center justify-center text-lg shadow-lg group-hover:scale-110 transition-transform">↗</span></span></div><div class="p-4"><h2 class="font-bold text-sm sm:text-base leading-snug line-clamp-2">${book.title}</h2><p class="text-xs text-orange mt-3 italic">${t}</p><p class="text-xs text-gray-400 mt-2 line-clamp-2">${book.description||'Material educativo para apoiar sua jornada.'}</p></div>`;card.addEventListener('click',()=>{document.getElementById('modal-theme').textContent=t;document.getElementById('modal-title').textContent=book.title;frame.src=book.embedUrl||book.embed_url;modal.classList.remove('hidden');modal.classList.add('flex')});grid.appendChild(card)})}themes.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className=`w-full text-left px-3 py-3 rounded-xl flex items-center gap-3 text-sm font-semibold transition-all ${i===0?'bg-orange/20 text-orange':'text-gray-300 hover:bg-white/5 hover:text-white'}`;b.innerHTML=`<span class="w-8 h-8 rounded-full bg-orange/20 text-orange flex items-center justify-center text-xs font-bold">${String(i+1).padStart(2,'0')}</span><span class="truncate">${t}</span><span class="ml-auto text-xs text-muted">${groups[t].length}</span>`;b.addEventListener('click',()=>render(t));nav.appendChild(b)});if(themes.length)render(themes[0])})()</script>
</body></html>
